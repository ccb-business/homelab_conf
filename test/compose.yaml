services:
  whoami:
    image: traefik/whoami:v1.10
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.home.eluusive.com`)
      - traefik.http.routers.whoami.entrypoints=websecure

networks:
  proxy:
    external: true
